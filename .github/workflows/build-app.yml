name: Build App

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit

      - name: Build wgt resources
        run: npm run build:app

      - name: Download and unzip HBuilderX
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download1.dcloud.net.cn/download/HBuilderX.7z'
          Write-Host "Downloading HBuilderX from $url"
          Invoke-WebRequest -Uri $url -OutFile HBuilderX.7z -UseBasicParsing
          7z x HBuilderX.7z -oC:\HBuilderX -y | Out-Null
          Get-ChildItem C:\HBuilderX | Select-Object -First 5
          Test-Path 'C:\HBuilderX\HBuilderX\cli.exe'

      - name: Set DCloud AppID in manifest.json
        run: |
          $appid = '${{ secrets.DCLOUD_APPID }}'
          if ([string]::IsNullOrWhiteSpace($appid)) { Write-Host 'DCLOUD_APPID secret not set, skipping'; exit 0 }
          $path = 'src\manifest.json'
          $json = Get-Content $path -Raw
          $json = $json -replace '"appid":\s*""', "`"appid`": `"$appid`""
          Set-Content -Path $path -Value $json -Encoding UTF8
          Write-Host 'manifest.json appid updated'

      - name: Login DCloud account
        env:
          DCLOUD_USERNAME: ${{ secrets.DCLOUD_USERNAME }}
          DCLOUD_PASSWORD: ${{ secrets.DCLOUD_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DCLOUD_USERNAME)) { Write-Host 'DCLOUD_USERNAME not set'; exit 0 }
          C:\HBuilderX\HBuilderX\cli.exe user --username $env:DCLOUD_USERNAME --password $env:DCLOUD_PASSWORD
        shell: pwsh

      - name: Open HBuilderX
        run: |
          C:\HBuilderX\HBuilderX\cli.exe open
          Start-Sleep -Seconds 30

      - name: Write pack config
        run: |
          $cfg = @{
            project = (Resolve-Path .).Path + '\src'
            platform = 'android'
            iscustom = $false
            safemode = $false
            android = @{
              packagename = 'com.cupidtide.im'
              androidpacktype = '1'
              certalias = ''
              certfile = ''
              certpassword = ''
              storePassword = ''
              channels = ''
            }
            isconfusion = $false
            splashads = $false
            rpads = $false
            pushads = $false
            exchange = $false
          } | ConvertTo-Json -Depth 5
          Set-Content -Path pack-config.json -Value $cfg -Encoding UTF8
          Get-Content pack-config.json

      - name: Run cloud packaging
        run: |
          C:\HBuilderX\HBuilderX\cli.exe pack --config (Resolve-Path pack-config.json).Path
        shell: pwsh

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-outputs
          path: |
            dist/build/app
            dist/dev/app
            pack-config.json
          if-no-files-found: warn
