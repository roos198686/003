name: Build App

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit

      - name: Build wgt resources
        run: npm run build:app

      - name: Show dist tree
        if: always()
        run: |
          echo "=== dist tree ==="
          if (Test-Path dist) { Get-ChildItem -Recurse dist | Select-Object FullName | Format-Table -AutoSize } else { echo "no dist" }

      - name: Set DCloud AppID via Node
        if: ${{ secrets.DCLOUD_APPID != '' }}
        env:
          DCLOUD_APPID: ${{ secrets.DCLOUD_APPID }}
        run: |
          node -e "const fs=require('fs');const p='src/manifest.json';const j=fs.readFileSync(p,'utf8').replace(/\"appid\":\s*\"[^\"]*\"/,`\"appid\": \"${process.env.DCLOUD_APPID}\"`);fs.writeFileSync(p,j);console.log('appid set');"

      - name: Download HBuilderX
        continue-on-error: true
        run: |
          $url = 'https://download1.dcloud.net.cn/download/HBuilderX.7z'
          Invoke-WebRequest -Uri $url -OutFile HBuilderX.7z -UseBasicParsing
          7z x HBuilderX.7z -oC:\HBuilderX -y | Out-Null
          Get-ChildItem C:\HBuilderX | Select-Object -First 5
          Test-Path 'C:\HBuilderX\HBuilderX\cli.exe'

      - name: Login DCloud
        if: ${{ secrets.DCLOUD_USERNAME != '' }}
        continue-on-error: true
        env:
          DCLOUD_USERNAME: ${{ secrets.DCLOUD_USERNAME }}
          DCLOUD_PASSWORD: ${{ secrets.DCLOUD_PASSWORD }}
        run: |
          C:\HBuilderX\HBuilderX\cli.exe user --username $env:DCLOUD_USERNAME --password $env:DCLOUD_PASSWORD

      - name: Open HBuilderX
        continue-on-error: true
        run: |
          C:\HBuilderX\HBuilderX\cli.exe open
          Start-Sleep -Seconds 30

      - name: Write pack config
        run: |
          $cfg = @{
            project = (Resolve-Path .).Path + '\src'
            platform = 'android'
            iscustom = $false
            safemode = $false
            android = @{
              packagename = 'com.cupidtide.im'
              androidpacktype = '1'
              certalias = ''
              certfile = ''
              certpassword = ''
              storePassword = ''
              channels = ''
            }
            isconfusion = $false
            splashads = $false
            rpads = $false
            pushads = $false
            exchange = $false
          } | ConvertTo-Json -Depth 5
          Set-Content -Path pack-config.json -Value $cfg -Encoding UTF8
          Get-Content pack-config.json

      - name: Run cloud packaging
        continue-on-error: true
        run: |
          C:\HBuilderX\HBuilderX\cli.exe pack --config (Resolve-Path pack-config.json).Path

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-outputs
          path: |
            dist/build/app
            dist/dev/app
            pack-config.json
          if-no-files-found: warn
