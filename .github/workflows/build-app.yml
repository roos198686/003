name: Build App

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit

      - name: Build H5 resources
        run: npm run build:h5

      - name: Copy H5 to iOS bundle resources
        run: |
          rm -rf ios-shell/Resources
          mkdir -p ios-shell/Resources/www
          cp -r dist/build/h5/* ios-shell/Resources/www/
          ls ios-shell/Resources/www

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios-shell
          xcodegen
          ls -la
          ls -la App.xcodeproj

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build .app (unsigned)
        run: |
          cd ios-shell
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" | tail -50

      - name: Pack .app into .ipa
        run: |
          cd ios-shell/build/Build/Products/Debug-iphoneos
          ls -la
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r -y App-unsigned.ipa Payload
          ls -la App-unsigned.ipa

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned-ipa
          path: ios-shell/build/Build/Products/Debug-iphoneos/App-unsigned.ipa
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ios-shell/build
          if-no-files-found: warn
