name: Build App

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build App resources (wgt)
        run: npm run build:app

      - name: List build output
        run: |
          echo "=== dist tree ==="
          find dist -maxdepth 4 2>/dev/null || true

      - name: Upload App artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-resources
          path: |
            dist/build/app
            dist/dev/app
          if-no-files-found: warn
