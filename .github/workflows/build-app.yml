name: Build App

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build App resources
        run: npm run build:app

      - name: Upload App artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-resources
          path: |
            dist/build/app
            dist/dev/app
          if-no-files-found: warn

      - name: Upload H5 artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5-dist
          path: dist/build/h5
          if-no-files-found: warn
